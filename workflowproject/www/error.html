<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录失败 · CloudBox</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1200px 800px at 80% -10%,#40141a 0%,transparent 60%),
      radial-gradient(1000px 700px at -10% 100%,#3a0606 0%,transparent 55%),#0a0707;
    color:#eaeefb;overflow:hidden}
  .card{position:relative;width:100%;max-width:420px;padding:44px 38px 38px;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);
    border-radius:18px;overflow:hidden;
    backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);
    text-align:center}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(120deg,#ff6a6a,#ff8a3b,#ff4a8d);
    background-size:200% 100%;animation:sh 4s linear infinite}
  @keyframes sh{to{background-position:200% 0}}
  .mark{width:64px;height:64px;margin:0 auto 22px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;
    background:linear-gradient(120deg,#ff6a6a,#ff8a3b);
    box-shadow:0 8px 26px rgba(255,106,106,.45)}
  h1{font-size:22px;font-weight:700;margin-bottom:10px;
    background:linear-gradient(120deg,#fff,#ffb0b0);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:14px;color:#b08a8a;line-height:1.7;margin-bottom:30px}
  a.btn{display:inline-block;padding:14px 32px;border-radius:12px;
    font-size:15px;font-weight:600;letter-spacing:.5px;color:#fff;text-decoration:none;
    background:linear-gradient(120deg,#ff6a6a,#ff8a3b);background-size:180% 180%;
    box-shadow:0 10px 30px rgba(255,106,106,.35);transition:all .3s}
  a.btn:hover{background-position:100% 0;box-shadow:0 14px 40px rgba(255,138,59,.5);transform:translateY(-1px)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">✕</div>
    <h1>登录失败</h1>
    <p class="sub">用户名或密码不正确<br>请检查后重试</p>
    <a class="btn" href="/login">← 返回登录</a>
  </div>
</body>
</html>
